<meta charset="utf-8">
<script>
/* Applica il tema salvato PRIMA del CSS/primo paint, per evitare un flash
   del tema sbagliato. Non deferrato di proposito (a differenza di nav.js/
   theme.js in fondo al body): deve girare prima che il CSS sia valutato.
   "auto" (assenza di data-theme) non richiede nulla qui: ci pensa la media
   query prefers-color-scheme in style.css. */
(function () {
  try {
    var t = localStorage.getItem("gpg-theme");
    if (t === "light" || t === "dark") {
      document.documentElement.setAttribute("data-theme", t);
    }
  } catch (e) {}
})();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ if .IsHome }}{{ .Site.Title }} — {{ .Site.Params.claim }}{{ else }}{{ .Title }} — {{ .Site.Title }}{{ end }}</title>
<meta name="description" content="{{ if .Description }}{{ .Description }}{{ else }}{{ .Site.Params.claim }}{{ end }}">
<link rel="canonical" href="{{ .Permalink }}">
<link rel="me" href="https://mountains.social/@gruppopugliagrotte">
<link rel="icon" href="{{ "favicon.svg" | relURL }}" type="image/svg+xml">
<link rel="icon" href="{{ "favicon.ico" | relURL }}" sizes="any">
<link rel="icon" href="{{ "favicon-16x16.png" | relURL }}" sizes="16x16" type="image/png">
<link rel="icon" href="{{ "favicon-32x32.png" | relURL }}" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="{{ "apple-touch-icon.png" | relURL }}">
<link rel="manifest" href="{{ "site.webmanifest" | relURL }}">
<meta name="theme-color" content="#001f94">

<!-- Stessi font del tema WordPress in uso (Twenty Thirteen): Bitter per i titoli,
     Source Sans Pro per il corpo del testo (anche nei pesi 300/300-italic usati
     da tagline e titoli dei widget). -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bitter:wght@400;700&family=Source+Sans+3:ital,wght@0,300;0,400;0,600;1,300&display=swap" rel="stylesheet">

<link rel="stylesheet" href="{{ "css/style.css" | relURL }}">

{{ if .OutputFormats.Get "rss" }}
{{ with .OutputFormats.Get "rss" }}
<link rel="alternate" type="application/rss+xml" title="{{ $.Site.Title }}" href="{{ .Permalink }}">
{{ end }}
{{ end }}
