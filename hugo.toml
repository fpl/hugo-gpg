baseURL = "https://www.gruppopugliagrotte.it/"
languageCode = "it-IT"
title = "Gruppo Puglia Grotte APS"
# Nessun tema esterno: tutto il layout vive in /layouts (vedi sotto).
paginate = 8
enableRobotsTXT = true
summarylength = 40

# Dichiarare [taxonomies] sostituisce i default di Hugo (category/tag), quindi
# vanno riportati esplicitamente insieme alla nuova "anno": usata per rendere
# "Archivi" nella sidebar un elenco di link reali (uno per anno) invece di
# semplice testo, sfruttando lo stesso meccanismo di Hugo già usato per le
# Categorie invece di scrivere pagine di archivio a mano.
[taxonomies]
  category = "categories"
  tag = "tags"
  anno = "anni"

[params]
  claim   = "Ricerca · Esplorazione · Didattica · Comunicazione speleologica"
  sede    = "Via Margherita di Savoia, 18 — 70013 Castellana Grotte (BA)"
  # Confermato da più post reali (2019, 2022, 2025): lezioni in sede ogni
  # martedì e giovedì dopo le 20:30, non solo il giovedì come indovinato prima.
  incontri = "Martedì e giovedì, dalle 20:30"
  fondazione = "1971"
  email_presidente = "presidente@gruppopugliagrotte.it"
  email_segreteria = "segreteria@gruppopugliagrotte.it"
  email_amministrazione = "amministrazione@gruppopugliagrotte.it"
  email_biblioteca = "biblioteca@gruppopugliagrotte.it"
  email_uscite = "responsabileuscite@gruppopugliagrotte.it"
  email_ambiente = "responsabileambiente@gruppopugliagrotte.it"
  facebook  = "https://www.facebook.com/gruppopugliagrotte"
  twitter   = "https://twitter.com/PugliaGrotte"
  youtube   = "http://www.youtube.com/user/GuppoPugliaGrotte"
  # Da content/chi-siamo/contatti.md (dato reale, non nel DB come theme_mod/widget).
  instagram = "https://www.instagram.com/gruppo_puglia_grotte"

# Nota: le voci di WordPress non pertinenti a un sito statico
# (login/wp-admin, archivio autore, feed dei commenti, ecc.)
# non hanno equivalente qui e sono state omesse di proposito.
#
# Struttura ricostruita dal menu reale nel DB WordPress (termine "Menu", 15 voci
# pubblicate in wp_posts/wp_postmeta, non più indovinata da snippet di ricerca).
# La voce "Home" del menu reale (link custom) non è ripetuta qui sotto come
# voce a sé nel DB originale: nel tema WordPress il logo/titolo del sito
# portava già alla home. Su questo sito il titolo non è più un link (poco
# intuitivo senza gli affordance visivi di un logo cliccabile): "Home" è
# quindi una voce di menu esplicita, aggiunta per decisione dell'utente
# (non presente nel DB reale). Punta a "/" per ora; in un'iterazione
# successiva potrà puntare a una pagina "hero" dedicata invece della home
# corrente (l'elenco notizie).
# La voce "La nostra storia" nel DB punta alla stessa pagina di "Chi siamo"
# (nessun contenuto separato) ed è stata omessa.

[menu]

  [[menu.main]]
    name   = "Home"
    url    = "/"
    weight = 5

  [[menu.main]]
    name   = "Chi siamo"
    url    = "/chi-siamo/"
    weight = 10

  [[menu.main]]
    name   = "Contatti"
    url    = "/chi-siamo/contatti/"
    parent = "Chi siamo"
    weight = 1

  [[menu.main]]
    name   = "Il Consiglio Direttivo"
